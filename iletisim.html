<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>İletişim — Elsewhere Academics</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body{font-family:Outfit,system-ui,sans-serif;margin:0;padding:32px;background:#f8fbff;color:#0f1f36}
    .wrap{max-width:760px;margin:20px auto;padding:24px;background:#fff;border-radius:10px;box-shadow:0 6px 18px rgba(12,34,56,0.06)}
    h1{margin-top:0}
    label{display:block;margin:12px 0 6px;font-weight:600}
    input[type="text"],input[type="email"],textarea{width:100%;padding:12px;border:1px solid #e1e7ef;border-radius:8px}
    button{margin-top:12px;padding:12px 18px;background:#1E5EEA;color:#fff;border:none;border-radius:999px;font-weight:600;cursor:pointer}
    .note{font-size:.95rem;color:#6d7a8d;margin-top:8px}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>İletişim</h1>
    <p class="note">Her türlü sorunuz için formu doldurabilirsiniz. Size en kısa sürede dönüş yapacağız.</p>

    <!-- FORMSPREE ACTION: buraya senin endpoint'in gelecek -->
    <form action="https://formspree.io/f/mdeaybbn" method="POST">
      <label for="name">İsim</label>
      <input id="name" name="name" type="text" required>

      <label for="email">E‑posta</label>
      <input id="email" name="email" type="email" required>

      <label for="message">Mesaj</label>
      <textarea id="message" name="message" rows="6" required></textarea>

      <!-- isteğe bağlı: form konu başlığı, redirect vs -->
      <input type="hidden" name="_subject" value="Yeni iletişim formu - Elsewhere Academics">
      <!-- isteğe bağlı: gönderim sonrası yönlendirme (repo'da /thankyou.html oluşturursan kullan) -->
      <!-- <input type="hidden" name="_redirect" value="https://elsewhereacademics.com/thankyou.html"> -->

      <button type="submit">Gönder</button>
    </form>
  </div>
</body>
</html>
